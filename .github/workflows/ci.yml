name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # A throwaway Postgres for the database tests in tests/test_db_views.py.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nba
          POSTGRES_PASSWORD: nba
          POSTGRES_DB: nba_predictor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nba -d nba_predictor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      PGPASSWORD: nba
      # Database tests skip when no database is reachable; in CI that must be a failure.
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Load schema and views
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U nba -d nba_predictor -f db/schema.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U nba -d nba_predictor -f db/views.sql

      - name: Run tests
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # --deny-warnings makes any lint warning fail the job instead of scrolling by.
      - name: Lint
        run: npm run lint -- --deny-warnings

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  docker-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose files
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.prod.yml --env-file .env.example config --quiet

      # Includes the pipeline image (tools profile), which "up" alone would skip.
      - name: Build images
        run: docker compose --profile tools build

      # migrate runs and exits first; the API waits for it and web waits for a healthy
      # API, so --wait returns once the whole stack is serving.
      - name: Start the stack
        run: docker compose up -d --wait

      # Startup already applied the schema and views once; a second run proves that
      # re-applying them to an existing database works.
      - name: Re-apply schema and views
        run: docker compose run --rm migrate

      - name: Check tables and views exist
        run: |
          tables=$(docker compose exec -T postgres psql -U nba -d nba_predictor -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE'")
          views=$(docker compose exec -T postgres psql -U nba -d nba_predictor -tAc \
            "SELECT count(*) FROM information_schema.views WHERE table_schema = 'public'")
          echo "tables=$tables views=$views"
          test "$tables" -eq 13 && test "$views" -eq 1

      # Requests go browser-style through nginx on port 8080, so this checks the whole
      # chain: nginx serves the app and forwards /api to FastAPI, which queries Postgres.
      # The database is empty here (CI cannot download NBA data), so /seasons is [].
      - name: Smoke-test the app through nginx
        run: |
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/some/client/route | grep -q '<div id="root">'
          test "$(curl -fsS http://localhost:8080/api/health)" = '{"status":"ok"}'
          test "$(curl -fsS http://localhost:8080/api/seasons)" = '[]'
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8080/api/standings?season=bad')" = 422

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
