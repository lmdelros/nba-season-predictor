server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # "api" is the API service's name on the Docker Compose network. Looking it up through
    # Docker's DNS on each request (the variable forces this) lets nginx start before the
    # API exists and follows the API to a new IP address if its container restarts; a
    # plain "proxy_pass http://api:8000" resolves once at startup and fails both cases.
    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://api:8000;

    location /api/ {
        # Strip the prefix: /api/standings reaches the API as /standings.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Vite puts a content hash in every asset filename, so a changed file gets a new
    # name and browsers can safely cache these for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: unknown paths fall back to index.html instead of a 404. index.html
    # itself is never cached, so a new deploy shows up on the next page load.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
