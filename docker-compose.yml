services:
  postgres:
    image: postgres:16
    container_name: nba-predictor-db
    environment:
      POSTGRES_USER: nba
      POSTGRES_PASSWORD: nba
      POSTGRES_DB: nba_predictor
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nba -d nba_predictor"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Applies db/schema.sql and then db/views.sql on every start, then exits. Both files
  # are safe to re-run, so this sets up a fresh database and brings an older one up to
  # date (missing tables and views) without touching existing data.
  migrate:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    # Standard libpq variables, read by psql, so the same command works against any
    # database (docker-compose.prod.yml points them at a managed one).
    environment:
      PGHOST: postgres
      PGUSER: nba
      PGPASSWORD: nba
      PGDATABASE: nba_predictor
    volumes:
      - ./db:/db:ro
    command: psql -v ON_ERROR_STOP=1 -f /db/schema.sql -f /db/views.sql
    restart: "no"

  # REST API. Interactive docs at http://localhost:8000/docs.
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
    ports:
      - "8000:8000"
    # /health runs a query, so "healthy" means the API is up and can reach Postgres.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # The React app, served by nginx, which forwards /api/... to the api service.
  # Open http://localhost:8080.
  web:
    build: frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

  # Pipeline scripts (ingestion, features, models, simulation) with the full Python
  # dependencies. The "tools" profile keeps it out of "docker compose up"; run it on
  # demand, and Compose starts Postgres and the migration first:
  #   docker compose run --rm pipeline python -m scripts.seed_demo
  pipeline:
    build:
      context: .
      dockerfile: pipeline.Dockerfile
    profiles: ["tools"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"

volumes:
  pgdata:
